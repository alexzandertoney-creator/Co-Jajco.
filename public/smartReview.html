  <main class="main">
  <div class="deck-controls">
    <select id="reviewDeckSelect" class="deck-title" aria-label="Review deck"></select>
  </div>
  <p class="meta review-sub" id="reviewSummary">Cards come back right before you'd forget them.</p>

  <div id="reviewDone" class="deck-empty-state" hidden></div>

  <section id="smartReviewContainer" class="mode-container" style="display: flex;">
    <div id="card" class="card">
      <div class="card-front">
        <p id="question"></p>
        <button id="speakFrontBtn" class="speak" title="Listen" aria-label="Listen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        </button>
      </div>
      <div class="card-back">
        <p id="answer"></p>
        <p id="answerNote" class="card-note" hidden></p>
        <button id="speakBackBtn" class="speak" title="Listen" aria-label="Listen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        </button>
      </div>
    </div>
    <div id="studyControls">
      <button id="incorrectBtn" class="danger">Not yet</button>
      <button id="correctBtn" class="success">I knew it</button>
    </div>

    <div class="card-nav">
      <button id="prev" class="ghost round" aria-label="Previous card"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="card-nav-center">
        <div id="cardProgress"></div>
        <p class="hint">Tap the card to flip</p>
      </div>
      <button id="next" class="ghost round" aria-label="Next card"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>

    <div class="options-row">
      <input type="checkbox" id="studyModeToggle" checked disabled hidden>
      <button id="swapSides" class="ghost small">Swap sides</button>
      <label class="inline-select">
        <span>Read aloud</span>
        <select id="speakMode">
          <option value="off">Off</option>
          <option value="learning">Learning side</option>
          <option value="native">Native side</option>
          <option value="both">Both sides</option>
        </select>
      </label>
    </div>
  </section>
  </main>

  <script src="js/dialogs.js"></script>
