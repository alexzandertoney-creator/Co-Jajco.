<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart review · Co? Jajco.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Fraunces:opsz,wght,SOFT@9..144,500..800,100&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="index.html">
      <img src="/images/logo.01.png" alt="" width="44" height="44">
      <span>Co? Jajco.</span>
    </a>

    <nav class="primary-nav" aria-label="Main">
      <a href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg><span>Study</span></a>
      <a href="smartReview.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg><span>Review</span></a>
      <a href="index.html#deckEditor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>Decks</span></a>
      <a href="index.html#storyAnalyzer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg><span>Stories</span></a>
      <a href="index.html#publicLibrary"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>Library</span></a>
    </nav>

    <div class="account">
      <label class="lang-picker">
        <span>Learning</span>
        <select id="languageSelect">
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="pl">Polish</option>
          <option value="jp">Japanese</option>
          <option value="it">Italian</option>
          <option value="en">English</option>
        </select>
      </label>
      <button id="logoutBtn" class="ghost">Log out</button>
    </div>
  </aside>

  <main class="main">
  <div class="deck-controls">
    <select id="reviewDeckSelect" class="deck-title" aria-label="Choose a saved deck"></select>
  </div>
  <p class="meta review-sub">Smart review brings back the cards you miss more often.</p>

  <section id="smartReviewContainer" class="mode-container" style="display: flex;">
    <div id="card" class="card">
      <div class="card-front">
        <p id="question"></p>
        <button id="speakFrontBtn" class="speak" title="Listen" aria-label="Listen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        </button>
      </div>
      <div class="card-back">
        <p id="answer"></p>
        <button id="speakBackBtn" class="speak" title="Listen" aria-label="Listen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        </button>
      </div>
    </div>
    <div id="studyControls">
      <button id="incorrectBtn" class="danger">Not yet</button>
      <button id="correctBtn" class="success">I knew it</button>
    </div>

    <div class="card-nav">
      <button id="prev" class="ghost round" aria-label="Previous card"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="card-nav-center">
        <div id="cardProgress"></div>
        <p class="hint">Tap the card to flip</p>
      </div>
      <button id="next" class="ghost round" aria-label="Next card"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>

    <div class="options-row">
      <input type="checkbox" id="studyModeToggle" checked disabled hidden>
      <button id="swapSides" class="ghost small">Swap sides</button>
      <label class="inline-select">
        <span>Read aloud</span>
        <select id="speakMode">
          <option value="off">Off</option>
          <option value="learning">Learning side</option>
          <option value="native">Native side</option>
          <option value="both">Both sides</option>
        </select>
      </label>
    </div>
  </section>
  </main>

  <script src="js/dialogs.js"></script>
  <script type="module" src="smartReview.js"></script>
  <script src="js/languageSync.js"></script>
</body>
</html>
