<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starter decks · Co? Jajco.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Fraunces:opsz,wght,SOFT@9..144,500..800,100&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="index.html">
      <img src="/images/logo.01.png" alt="" width="44" height="44">
      <span>Co? Jajco.</span>
    </a>

    <nav class="primary-nav" aria-label="Main">
      <a href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg><span>Study</span></a>
      <a href="smartReview.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg><span>Review</span></a>
      <a href="index.html#deckEditor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>Decks</span></a>
      <a href="index.html#storyAnalyzer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg><span>Stories</span></a>
      <a href="index.html#publicLibrary" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>Library</span></a>
    </nav>

    <div class="account">
      <label class="lang-picker">
        <span>Learning</span>
        <select id="languageSelect">
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="pl">Polish</option>
          <option value="jp">Japanese</option>
          <option value="it">Italian</option>
          <option value="en">English</option>
        </select>
      </label>
      <button id="logoutBtn" class="ghost">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <a href="index.html#publicLibrary">← Library</a>
        <h1>Starter decks</h1>
        <p class="meta">Tick the decks you want, then add them to your collection.</p>
      </div>
    </div>

    <div class="deck-columns">
      <details class="deck-column" open>
        <summary>Pre-A1</summary>
        <div class="deck-list" id="columnPreA1"></div>
      </details>
      <details class="deck-column">
        <summary>A1</summary>
        <div class="deck-list" id="columnA1"></div>
      </details>
      <details class="deck-column">
        <summary>A2</summary>
        <div class="deck-list" id="columnA2"></div>
      </details>
      <details class="deck-column">
        <summary>Prepositions</summary>
        <div class="deck-list" id="columnPrepositions"></div>
      </details>
    </div>

    <div class="action-bar">
      <button id="addSelectedDecks">Add selected decks</button>
    </div>
  </main>

  <script type="module" src="recommended.js"></script>
  <script src="js/languageSync.js"></script>
</body>
</html>
