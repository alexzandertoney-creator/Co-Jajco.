<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recommended Decks - Co? Jajco.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" style="background-color: var(--primary);">
    <div style="display: flex;  justify-content: space-between; align-items: center; width: 100%; gap: 20px;">
      <h1 style="margin: 0;"><img src="/images/logo.01.png" alt="Logo" width="200" height="200"></h1>
      <nav style="display: flex; flex-direction: column; gap: 8px; align-items: flex-end;">
        <div style="display: flex; gap: 12px; align-items: center;">
          <label for="languageSelect" style="color: var(--text-dark); margin: 0;">Learning Language:</label>
          <select id="languageSelect" style="width: 150px;">
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="pl">Polish</option>
            <option value="jp">Japanese</option>
            <option value="it">Italian</option>
            <option value="en">English</option>
          </select>
          <button id="logoutBtn" class="secondary">Logout</button>
        </div>
        <button onclick="window.location.href='index.html'" class="secondary">⬅ Home</button>
      </nav>
    </div>
  </header>

  <div class="deck-columns">
    <div class="deck-column" id="columnPreA1">
      <h2>Pre-A1</h2>
    </div>
    <div class="deck-column" id="columnA1">
      <h2>A1</h2>
    </div>
    <div class="deck-column" id="columnA2">
      <h2>A2</h2>
    </div>
    <div class="deck-column" id="columnPrepositions">
      <h2>Prepositions</h2>
    </div>
  </div>

  <div style="display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap;">
    <button id="addSelectedDecks">➕ Add Selected Decks</button>
    <button onclick="window.location.href='index.html'" class="secondary">⬅ Back to Home</button>
  </div>

  <script type="module" src="recommended.js"></script>
  <script src="js/languageSync.js"></script>
</body>
</html>
