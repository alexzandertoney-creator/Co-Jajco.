<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account · Co? Jajco.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Fraunces:opsz,wght,SOFT@9..144,500..800,100&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="auth-page">
    <form class="form-container" id="registerForm" novalidate>
      <img class="auth-logo" src="/images/logo.01.png" alt="Co? Jajco." width="96" height="96">
      <h1>Create your account</h1>
      <p class="meta">Pick what you speak and what you're learning.</p>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" />
      </div>

      <div class="form-group">
        <label for="nativeLang">I speak</label>
        <select id="nativeLang">
          <option value="en">English</option>
          <option value="pl">Polish</option>
        </select>
      </div>

      <div class="form-group">
        <label for="learningLang">I'm learning</label>
        <select id="learningLang">
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="pl">Polish</option>
          <option value="it">Italian</option>
        </select>
      </div>

      <button id="registerBtn" type="submit">Create account</button>

      <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
    </form>
  </main>

  <script src="js/dialogs.js"></script>
  <script src="register.js"></script>
</body>
</html>
