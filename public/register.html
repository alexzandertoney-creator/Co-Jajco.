<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Co? Jajco.</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; width: 100%;">
    <div class="form-container">
      <h1 style="text-align: center; margin-top: 0;">📘 Co? Jajco.</h1>
      <h2 style="text-align: center;">Create Account</h2>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="your@email.com" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" />
      </div>

      <div class="form-group">
        <label for="nativeLang">Native Language</label>
        <select id="nativeLang">
          <option value="en">English</option>
          <option value="pl">Polish</option>
        </select>
      </div>

      <div class="form-group">
        <label for="learningLang">Learning Language</label>
        <select id="learningLang">
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="pl">Polish</option>
          <option value="it">Italian</option>
        </select>
      </div>

      <button id="registerBtn" style="width: 100%; padding: 12px; font-size: 16px;">Create Account</button>

      <p style="text-align: center; margin-top: 16px;">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>

  <script src="register.js"></script>
</body>
</html>
