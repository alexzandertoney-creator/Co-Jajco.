<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account · Co? Jajco.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Fraunces:opsz,wght,SOFT@9..144,500..800,100&display=swap" rel="stylesheet" />
  <script>/* Old .html addresses -> clean URLs. */(function(){var m={'/index.html':'/','/smartReview.html':'/review','/recommended.html':'/library/starter','/login.html':'/login','/register.html':'/register'},p=m[location.pathname];if(p)history.replaceState(null,'',p+location.search+location.hash)})();</script>
  <script>/* Apply the saved appearance before first paint (no flash). */try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <main class="auth-page">
    <div class="auth-hero" aria-hidden="true">
      <p class="auth-brand">Co? Jajco.</p>
      <svg class="forest-art" viewBox="0 0 400 120" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
      <path class="far" d="M0 120V78l46-34 38 26 52-46 58 44 34-22 60 40 44-30 68 44v40Z"/>
      <path class="snow" d="M136 24l-14 13 9-2 5 6 6-6 9 2Z M46 44l-10 9 7-1 3 4 4-4 6 1Z"/>
      <g class="near">
        <path d="M18 120l14-40 14 40Z M30 120l12-30 12 30Z"/>
        <path d="M70 120l18-52 18 52Z M92 120l12-34 12 34Z"/>
        <path d="M262 120l16-46 16 46Z M286 120l12-32 12 32Z"/>
        <path d="M330 120l18-56 18 56Z M356 120l13-36 13 36Z M378 120l11-28 11 28Z"/>
      </g>
    </svg>
      <div class="auth-mascot" id="authMascot"></div>
    </div>
    <form class="form-container" id="registerForm" novalidate>
      <img class="auth-logo" src="/images/logo-192.png" alt="Co? Jajco." width="96" height="96">
      <h1>Create your account</h1>
      <p class="meta">Pick what you speak and what you're learning.</p>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" />
      </div>

      <div class="form-group">
        <label for="nativeLang">I speak</label>
        <select id="nativeLang">
          <option value="en">English</option>
          <option value="pl">Polish</option>
        </select>
      </div>

      <div class="form-group">
        <label for="learningLang">I'm learning</label>
        <select id="learningLang">
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="pl">Polish</option>
          <option value="it">Italian</option>
        </select>
      </div>

      <button id="registerBtn" type="submit">Create account</button>

      <p class="switch">Already have an account? <a href="/login">Log in</a></p>
    </form>
  </main>

  <script src="/js/dialogs.js"></script>
  <script src="/js/selects.js"></script>
  <script src="/register.js"></script>
  <script type="module">import { mascot } from "/js/art.js"; document.getElementById("authMascot").innerHTML = mascot("wave");</script>
</body>
</html>
